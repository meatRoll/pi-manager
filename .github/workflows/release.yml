name: Release

# A pushed version tag is the only trigger: releases are never cut from a branch.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script reads tags and CHANGELOG.md from the checked-out history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Title and body come from the `## vX.Y.Z` section of CHANGELOG.md, so the
      # release cannot drift from the changelog. Re-running is a no-op.
      - name: Create release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs "$GITHUB_REF_NAME"
